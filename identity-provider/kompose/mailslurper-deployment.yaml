apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ../quickstart.yml
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: mailslurper
  name: mailslurper
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mailslurper
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ../quickstart.yml
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: mailslurper
    spec:
      containers:
        - image: oryd/mailslurper:latest-smtps
          name: mailslurper
          ports:
            - containerPort: 4436
              protocol: TCP
            - containerPort: 4437
              protocol: TCP
      restartPolicy: Always
