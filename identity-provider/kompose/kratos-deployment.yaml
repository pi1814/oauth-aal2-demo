apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ../quickstart.yml
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: kratos
  name: kratos
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kratos
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ../quickstart.yml
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: kratos
    spec:
      containers:
        - args:
            - serve
            - -c
            - /etc/config/kratos/kratos.yml
            - --dev
            - --watch-courier
          env:
            - name: DSN
              value: sqlite:///var/lib/sqlite/db.sqlite?_fk=true
            - name: LOG_LEVEL
              value: trace
          image: oryd/kratos:v1.1.0
          name: kratos
          ports:
            - containerPort: 4433
              protocol: TCP
            - containerPort: 4434
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/sqlite
              name: kratos-sqlite
            - mountPath: /etc/config/kratos
              name: kratos-cm1
      restartPolicy: Always
      volumes:
        - name: kratos-sqlite
          persistentVolumeClaim:
            claimName: kratos-sqlite
        - configMap:
            name: kratos-cm1
          name: kratos-cm1
